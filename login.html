<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#140b21"><title>Log In — Gemstone Valley</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body class="auth-page" data-auth-mode="login">
 <main class="standalone-auth-card">
  <a class="back-link" href="index.html">← Back to Gemstone Valley</a>
  <h1>Log In</h1>
  <p>Use your Gemstone Valley player account and cloud save.</p>
  <form id="standaloneAuthForm">
   <label for="email">Email</label>
   <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="player@example.com" required>
      <label for="password">Password</label>
      <input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="At least 6 characters" required>
   <button class="auth-primary standalone-submit" type="submit">Log In</button>
  </form>
  <div class="auth-status" id="authPageStatus" role="status" aria-live="polite">Enter your details.</div>
  <p class="auth-switch">New player? <a href="signup.html">Create an account</a>.</p>
 </main>
 <script src="config.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8"></script>
 <script src="auth.js"></script>
</body></html>
