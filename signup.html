<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#140b21"><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><title>Create Account · Gemstone Valley</title></head><body data-page="signup">
<div class="site-shell"><nav class="site-nav"><a class="brand" href="index.html">💎 Gemstone <span>Valley</span></a><a class="nav-link" href="login.html">Log In</a></nav>
<section class="page-card"><h1>Create your player</h1><p class="lead">Register a permanent username and a display name for leaderboards.</p>
<form id="signupForm">
<div class="form-group"><label for="username">Username</label><input id="username" maxlength="20" autocomplete="username" placeholder="crystal_miner" required></div>
<div class="form-group"><label for="displayName">Display Name</label><input id="displayName" maxlength="32" placeholder="Crystal Miner" required></div>
<div class="form-group"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
<div class="form-group"><label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="new-password" required></div>
<div class="form-group"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required></div>
<label class="check-row"><input id="terms" type="checkbox"> <span>I agree to the Terms and understand that game progress may be stored in Supabase.</span></label>
<div class="form-actions"><button class="btn primary" type="submit">Create Account</button></div></form>
<div id="formStatus" class="form-status" role="status">Choose a unique username and enter your account details.</div><div class="form-footer">Already registered? <a href="login.html">Log in</a></div></section></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8"></script><script src="app.js"></script><script src="auth.js"></script></body></html>
